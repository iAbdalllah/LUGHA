# Local services for the LUGHA backend: PostgreSQL (production database engine), Redis, Mailpit.
# docker compose up -d   →   then set DB_CONNECTION=pgsql (see backend/.env.example).
services:
  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lugha
      POSTGRES_USER: lugha
      POSTGRES_PASSWORD: lugha-local-only
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lugha"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["63799:6379"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
