[package]
name = "lugha-ffi"
description = "C ABI over lugha-core for the Swift (macOS/iOS) apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
lugha-core = { path = "../lugha-core" }
lugha-link = { path = "../lugha-link" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
# LUGHA Remote Play for the iPhone and Mac apps (AGPL-3.0, chiaki-ng). Off by default: it needs CMake.
lugha-rp = { path = "../lugha-rp", optional = true, default-features = false }

[dev-dependencies]
lugha-core = { path = "../lugha-core", features = ["issuer"] }

[features]
remoteplay = ["dep:lugha-rp"]
