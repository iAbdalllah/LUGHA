<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>LUGHA overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { position: relative; font: 600 30px/1.4 "Segoe UI", Tahoma, sans-serif; color: #fff; }
  /* The subtitle block: current line at the bottom, an earlier line (still being read) dimmed above it. */
  #block { position: absolute; transform: translateX(-50%); max-width: 92vw; text-align: center; border-radius: 10px;
           padding: 6px 20px; text-shadow: 0 2px 4px #000; box-sizing: border-box; }
  #block.over { background: rgba(0,0,0,.78); }
  #block.above { background: transparent; text-shadow: 0 0 4px #000, 0 0 2px #000, 0 2px 6px #000; }
  #block .line { display: block; }
  #block .line.old { opacity: .55; }
  .spk { color: #e9b44c; font-size: .72em; font-weight: 700; }
  /* History: narrow, translucent, steps back a few seconds after the last line. */
  #history { position: absolute; top: 45%; transform: translateY(-50%); width: 22vw; max-height: 60vh; overflow: hidden;
             background: rgba(10,10,14,.6); border-radius: 12px; padding: 12px 16px; box-sizing: border-box;
             font-size: 17px; font-weight: 500; line-height: 1.45; transition: opacity .5s; }
  #history.left { left: 1.5vw; } #history.right { right: 1.5vw; }
  #history .item { padding: 3px 0; }
  .fade { animation: fadein var(--fade, 150ms) ease-out; }
  @keyframes fadein { from { opacity: 0; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="block" class="over" hidden></div>
<div id="history" hidden></div>
<script src="overlay-logic.js"></script>
<script src="overlay.js"></script>
</body>
</html>
