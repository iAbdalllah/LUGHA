name: lugha_mobile
description: LUGHA companion app — library, packages, devices and TV remote.
publish_to: none
version: 0.1.0+8

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  lugha_engine:
    path: packages/lugha_engine
  lugha_remoteplay:
    path: packages/lugha_remoteplay
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  multicast_dns: ^0.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
