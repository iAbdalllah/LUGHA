name: engine

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # chiaki-ng, for lugha-rp
      # lugha-rp builds chiaki-ng with CMake; its nanopb step needs Python with protobuf (grpcio-tools brings protoc).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install protobuf grpcio-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run --release -p lugha-pkg -- bench --lines 5000
