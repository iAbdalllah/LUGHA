name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lugha_test
          POSTGRES_USER: lugha
          POSTGRES_PASSWORD: lugha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lugha" --health-interval 5s --health-retries 10
    strategy:
      matrix:
        db: [sqlite, pgsql]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite, intl, bcmath, gd, zip, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - name: Tests (${{ matrix.db }})
        run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.db == 'pgsql' && 'lugha_test' || ':memory:' }}
          DB_USERNAME: lugha
          DB_PASSWORD: lugha
          ADMIN_MFA_REQUIRED: "false"
