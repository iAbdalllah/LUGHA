name: android-tv

on:
  push:
    paths: ["apps/tv/**", "engine/lugha-link/**", "engine/lugha-link-jni/**", ".github/workflows/android-tv.yml"]
  pull_request:
    paths: ["apps/tv/**", "engine/lugha-link/**", "engine/lugha-link-jni/**", ".github/workflows/android-tv.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973" ./engine/scripts/build-android.sh
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
        working-directory: apps/tv
