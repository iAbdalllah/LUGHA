name: windows-app

on:
  push:
    paths: ["apps/windows/**", "engine/**", "apps/mobile/third_party/chiaki-ng", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["apps/windows/**", "engine/**", "apps/mobile/third_party/chiaki-ng", ".github/workflows/windows.yml"]

jobs:
  core:
    # API client, sync, subtitle pipeline, TV link — no Windows APIs, so it also runs on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - run: cargo test --no-default-features
        working-directory: apps/windows/src-tauri

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # chiaki-ng, for the PS5 source (engine/lugha-rp)
      # lugha-rp builds chiaki-ng with CMake; its nanopb step needs Python's protobuf module.
      - run: pip install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - name: Tests (core + Windows OCR + capture)
        run: cargo test --no-default-features -- --nocapture
        working-directory: apps/windows/src-tauri
      - name: Installer (NSIS + MSI)
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build
        working-directory: apps/windows/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: lugha-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
