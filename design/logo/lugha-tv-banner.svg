<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E25"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F7CD6B"/>
      <stop offset="1" stop-color="#C4872F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#E9B44C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E9B44C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- The mark, on its own rounded tile -->
  <g transform="translate(120 160)">
    <rect width="400" height="400" rx="92" fill="#16181D" stroke="#2A2E37" stroke-width="4"/>
    <g transform="scale(0.390625)"><g transform="translate(-18 -34)">
  <!-- The letter lam (ل), calligraphic: a tall stem into a wide bowl whose tail thins as it rises. -->
  <path fill="url(#gold)" d="
    M 640 214 Q 640 150 706 150 Q 772 150 772 214
    L 772 600
    C 772 790 640 884 474 884
    C 290 884 168 772 168 612
    C 168 548 182 498 204 460
    Q 220 436 238 458
    C 252 478 256 520 256 566
    C 256 712 352 792 474 792
    C 590 792 640 714 640 600 Z"/>
  <!-- Subtitle lines resting in the bowl, right-aligned (Arabic reads right to left). -->
  <rect x="352" y="560" width="232" height="54" rx="27" fill="#F2F3F5" opacity="0.94"/>
  <rect x="432" y="654" width="152" height="54" rx="27" fill="#F2F3F5" opacity="0.6"/>
  </g></g>
  </g>
  <text x="1160" y="360" text-anchor="end" font-family="Geeza Pro, Arial" font-weight="700" font-size="190" fill="#F2F3F5">لغة</text>
  <text x="1160" y="500" text-anchor="end" font-family="Helvetica Neue, Arial" font-weight="700" font-size="92" letter-spacing="18" fill="#E9B44C">LUGHA</text>
</svg>